name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Giai nen site.zip
        run: |
          mkdir _site
          unzip -q site.zip -d _site
          touch _site/.nojekyll
          # Trang đăng bài + ảnh/video các đợt mới (giữ ngoài site.zip để zip không vượt giới hạn 100MB của GitHub)
          if [ -d site-media ]; then mkdir -p _site/media && cp -r site-media/. _site/media/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
